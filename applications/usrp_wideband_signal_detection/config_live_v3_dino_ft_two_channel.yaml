# Live dual-channel v3 with the DINO-FT (M2_dr) detector on BOTH channels: ch0 @ 2.4 GHz,
# ch1 @ 1 GHz, 491.52 MSps each. Same dual wiring as config_live_v3_two_channel.yaml; the
# detector runs the rate-adaptive downsample path with circular edge inference (border-bias
# fix) per channel. Launched by the conductor when the dual demo's Detector dropdown selects
# DINO-FT (run_live_demo.sh v3dual + demo_conductor.py --dual).
# SPDX-FileCopyrightText: 2026 National Instruments Corporation
# SPDX-License-Identifier: Apache-2.0
---
num_runs: -1

pipeline:
  enable_spectrogram: true
  enable_detector: true
  enable_signal_snipper: true
  enable_snippet_compression: true
  detector_type: "cuda_dino_finetuned"
  log_from_spectrogram: false

scheduler:
  worker_thread_number: 8   # dual-channel graph (2x converter/fft/spectrogram/detector + viz) starves at 4 workers
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 500

advanced_network:
  cfg:
    version: 1
    manager: "dpdk"
    master_core: 3   # must be LOWER than the worker cores: DPDK takes the lowest core in -l as its main lcore, and workers cannot launch on the main lcore (workers ride the isolated cores 5,7)
    debug: false
    log_level: "info"
    rx_meta_buffers: 8192

    memory_regions:
      - name: "Headers_RX_CPU"
        kind: "huge"
        affinity: 0
        access:
          - local
        num_bufs: 262144
        buf_size: 42
      - name: "CH1_CHDR_Headers_RX_CPU"
        kind: "huge"
        affinity: 0
        access:
          - local
        num_bufs: 262144
        buf_size: 64
      - name: "CH1_Data_RX_GPU"
        kind: "huge"   # GB10 integrated GPU: NIC DMAs into host hugepages, GPU reads coherently (see notes/gb10_unified_memory_ingest.md)
        affinity: 0
        access:
          - local
        num_bufs: 327680   # +25%: dual fan-out (fft+snipper+log x2ch) held enough bursts to exhaust 262144 under GPU-saturation transients
        buf_size: 4096
      - name: "CH2_CHDR_Headers_RX_CPU"
        kind: "huge"
        affinity: 0
        access:
          - local
        num_bufs: 262144
        buf_size: 64
      - name: "CH2_Data_RX_GPU"
        kind: "huge"   # GB10 integrated GPU: NIC DMAs into host hugepages, GPU reads coherently (see notes/gb10_unified_memory_ingest.md)
        affinity: 0
        access:
          - local
        num_bufs: 327680   # +25%: dual fan-out (fft+snipper+log x2ch) held enough bursts to exhaust 262144 under GPU-saturation transients
        buf_size: 4096

    interfaces:
      - name: sdr_data
        address: 0000:01:00.0
        rx:
          flow_isolation: true
          queues:
            - name: "Channel 1 data"
              id: 0
              cpu_core: 5   # isolated core (isolcpus=5,7) — kernel keeps it free, so DPDK RX polling runs unpreempted
              batch_size: 10240
              memory_regions:
                - "Headers_RX_CPU"
                - "CH1_CHDR_Headers_RX_CPU"
                - "CH1_Data_RX_GPU"
            - name: "Channel 2 data"
              id: 1
              cpu_core: 7   # isolated core (isolcpus=5,7)
              batch_size: 10240
              memory_regions:
                - "Headers_RX_CPU"
                - "CH2_CHDR_Headers_RX_CPU"
                - "CH2_Data_RX_GPU"

          flows:
            - name: "Channel 1 data packets"
              id: 0
              action:
                type: queue
                id: 0
              match:
                udp_src: 49153
                udp_dst: 1234
            - name: "Channel 2 data packets"
              id: 1
              action:
                type: queue
                id: 1
              match:
                udp_src: 49153
                udp_dst: 1235

chdr_converter:
  interface_name: sdr_data
  channel_center_frequencies_hz: "2400e6,1000e6"
  num_complex_samples_per_packet: 1024
  num_packets_per_fft: 20
  num_ffts_per_batch: 512   # frame size (21.3 ms of RF per batch). Since the Tier A+B GPU work (2026-08-15), dual full rate is LOSSLESS at this setting with per-frame detection. Historical: 256 sheds via out_q backpressure -> RX mempool exhaustion -> NIC drops + error spam; avoid. Must equal fft.num_bursts.
  num_simul_batches: 4   # hard max: chdr_rx supports 4 in-flight batch slots (app aborts on more)
  num_channels: 2
  log_packets: false
  log_data: false
  partial_batch_drop_timeout_ms: 250
  degraded_reset_on_rx_queue_warning: false
  degraded_shutdown_on_rx_queue_warning_threshold: 0   # 3 caused a full channel resync (visible spectrogram zero-out + data loss) every 3rd NIC micro-drop warning; 0 disables it. The partial-flush self-heal still covers real stalls.
  degraded_shutdown_force_exit_timeout_ms: 2000
  degraded_reset_partial_flush_threshold: 3
  degraded_reset_cooldown_ms: 1000

fft:
  burst_size: 20480
  num_bursts: 512   # must match chdr_converter.num_ffts_per_batch
  num_channels: 2
  spectrum_type: 1
  averaging_type: 1
  window_time: 0
  window_type: 0
  reference_span_hz: 500000000
  reference_fft_size: 20480
  override_fft_bin_size: 0
  # FFT length in bins. For this path it should stay aligned with burst_size.
  transform_points: 20480
  # Window size in bins. Keep this equal to transform_points unless you intentionally window a smaller FFT.
  window_points: 20480
  # Fallback bin width in Hz. Keep this equal to round(span / transform_points).
  resolution: 24414
  # Analyzed bandwidth in Hz. When upstream metadata does not provide sample_rate_hz,
  # this must match the radio sender rate, e.g. rx_to_remote_udp.py --rate 500e6.
  span: 500000000
  weighting_factor: 0
  f1_index: -10240
  f2_index: 10239
  window_time_delta: 0

logger:
  num_channels: 2
  log_interval: 5

visualization:
  detector_label: "Dinov3 FT (dual)"
  enable: true
  renderer:
    num_channels: 2
    history_frames: 1
    output_height: 720
    output_width: 1920
    display_time_rows: 2048
    display_freq_bins: 20480
    history_memory_budget_mb: 1024
    rows_per_frame: 8   # waterfall scroll cadence (display-only, no pipeline cost) — match the single-channel feel; was 2, which made dual look ~4x slower than it is
    mask_frame_offset: 0
    allow_backpressure_valve: true
    render_every_n_frames: 1   # no display decimation: at the current operating point (batch 512, emit_stride 2) rendering every frame costs nothing measurable — coverage/latency identical to render=3
    timing_summary_enable: true
    timing_summary_every_n: 128
    decode_metrics_json: "/workspace/spectrograms/rt_metrics.json"   # LIVE DECODE sidebar panel (written by rt_decode_daemon.py --metrics-out)
    demo_control_json: "/workspace/spectrograms/demo_control.json"
    demo_controls_snr: false          # live radio: SNR pcap switching does not apply   # DEMO CONTROLS panel -> daemon gate + replay conductor
    channel_filter: -1
    tensor_name: "spectrogram"
    demo_title: "Enabling RF AI for Ultra Wideband Real Time Applications"
    demo_subtitle: "Holoscan enables GPU native real time signal processing and computer vision models to detect and extract regions of interest \n \t\t\t\t\t\t from dual 500 MSps streams, reducing RF AI workloads to only the regions that matter."
    blue_limit: 0.15
    red_limit: 0.88
    overlay_alpha: 0.7 #0.38
    center_frequency_hz: 0.0
    fft_size: 20480
    dino_chunk_rows: 256
    dino_chunk_cols: 512
    db_floor: -20.0
    db_ceil: 15.0
    row_average_n: 1
  holoviz:
    width: 1920
    height: 720
    window_title: "USRP Wideband Spectrogram"
    fullscreen: false

spectrogram:
  num_channels: 2
  enable_save: false
  enable_tensor_save: false
  save_every_n_frames: 100
  max_images_per_channel: 0
  output_height: 256
  output_width: 512
  output_dir: "/workspace/spectrograms"

coherent_power_signal_detector:
  num_channels: 2
  input_height: 250
  input_width: 20480
  # Full-rate aggressive profile matching the active single-channel fast path,
  # extended to dual-channel artifact capture.
  fast_power_floor_db: 0.5
  fast_power_span_db: 3.0
  fast_score_threshold: 0.7
  live_emit_mask_rows: 16
  live_emit_mask_cols: 20480
  live_emit_freq_persistence_window: 45
  live_emit_freq_persistence_min_hits: 11
  emit_stride: 1   # per-frame detection at full dual rate — GOAL STATE, measured 2026-08-15: two 60 s runs, zero NIC drops, zero shed, full 0.48 Mpps/ch (gpu_optimization_plan.md; needed Tier A + Tier B round 1)
  emit_mask_diagnostic_counts: false   # skip the 4 diagnostic full-mask count passes per frame (audit-log only); the emitted-mask count still runs
  log_detections: false
  save_performance_path_artifacts: false
  enable_mask_save: false
  save_every_n_frames: 100
  output_dir: "/workspace/coherent_power_masks"
  ignore_sideband_percent: 0.0
  ignore_sideband_hz: 7000000.0
  frontend_reference_q: 75.0
  frontend_smooth_sigma: 12.0
  frontend_max_boost_db: 0.0
  frontend_signal_cap_db: 0.0
  filter_detection_mask: true
  timing_summary_enable: true
  timing_summary_every_n: 512
  timing_summary_window: 512

# --- v3 live pipeline additions (dual channel) ---
snippet_compression:
  codec: "none"
  bfp_block: 64                       # complex samples per shared-exponent block (bfp codecs)
  control_json_path: "/workspace/spectrograms/demo_control.json"

signal_snipper:
  # Flood guard: skip masks lighting >30% of band-time (detector fault, not signal)
  max_mask_occupancy: 0.30
  # "time_only": keep the time regions containing any signal at full bandwidth/rate; annotate the
  #   detected freqs/bandwidths in each interval.
  # "frequency": additionally isolate each signal -- shift to 0 Hz, low-pass to its bandwidth, and
  #   (optionally) decimate to the minimum rate plus oversample margin.
  mode: "frequency"
  oversample_percent: 25.0
  enable_downsample: true
  bandwidth_margin_hz: 0.0
  # Clustering: drop connected components smaller than min_box_pixels (speckle), then coalesce
  # fragments within merge_gap_{rows,cols} mask pixels. Tuned so the dense detector mask collapses
  # to a few signal boxes instead of hundreds of slivers.
  min_box_pixels: 256
  merge_gap_rows: 16
  merge_gap_cols: 80
  fir_num_taps: 129
  # Max full-rate IQ frames buffered awaiting their mask. Must exceed (a) the offline greedy
  # scheduler's ~15-20 frame source lead, AND (b) the mask spacing when strided: with
  # coherent_power_signal_detector.emit_stride=N, masks are N frames apart, so keep this >= ~2*N + lag
  # (here 2*16 = 32). Each buffered frame is ~num_bursts*burst_size complex samples (tens of MB), so
  # raising it costs device memory.
  ring_depth: 32
  # Both default to 0 = auto: the snipper reads the true rate/center from pipeline metadata
  # (rx_sample_rate_hz / rx_center_frequency_hz, stamped by the CHDR converter from the
  # channel_sample_rates_hz / channel_center_frequencies_hz above; from the SigMF core:sample_rate
  # offline). Set > 0 only to force a value when no metadata is available.
  center_frequency_hz: 0.0
  sample_rate_hz: 0.0

sigmf_file_sink:
  # v3: snips on disk are a CLASSIFICATION SAMPLE, not the product. Real writes
  # are budgeted; ALL output bytes (incl. budget-skipped packs) are counted in
  # stats_json, which the daemon prefers for the data-saved metric.
  write_budget_mb_s: 48.0
  stats_json: "/workspace/spectrograms/snip_stats.json"
  # "per_signal": one SigMF recording per snippet, written as they arrive.
  # "pack": accumulate `pack_frames` frames, then flush; snippets are grouped by (rate, center) into
  #   concatenated recordings, tied by a .sigmf-collection when a pack spans multiple groups.
  mode: "pack"
  pack_frames: 16
  output_dir: "/workspace/spectrograms/snippets"
  filename_prefix: "snip"

finetuned_dino_detector:
  num_channels: 2
  tile_rows: 256
  nfft: 1024
  fft_window: "hann"
  db_vmin: -47.6526985168457
  db_vmax: 20.45633316040039
  threshold: 0.95
  model_script_path: "/workspace/holohub/dino_fine_tuning/weights/finetuned_dino_m2_dr_bf16.ts"
  torch_dtype: "fp32"               # vestigial: bf16 compute is baked into the traced .ts
  # LIVE @ 491.52 MSps: with downsample mode the frame cost is ~2 tiles (rate-adaptive), so a
  # low stride is affordable and the ROI history reads as a continuous ribbon (viz holds the last
  # mask up to 48 frames) instead of chunk-by-chunk. Native mode (below) is 20+ tiles/frame and
  # forced the coarse stride-16 blocks.
  # DUAL: measured live 2026-09-08 — under dual contention each emitted frame costs ~110 ms
  # (vs 46 ms solo), so stride 8 put DINO alone at >100% GPU and ingest fell to 65%. Stride 16
  # (one mask per ~340 ms per channel) budgets DINO at ~40% GPU next to 2x FFT/viz/snips.
  emit_stride: 16
  channel_filter: -1
  # Native nfft-FFT at 491.52 MSps = 480 kHz/bin, DOUBLE M2_dr's trained 240 kHz/bin -> every
  # signal reads half-width at the wrong scale. Downsample mode FFTs wide (auto-sized to the actual
  # rate) then resizes the freq axis to nfft inside torch, so the model sees its trained per-pixel
  # geometry REGARDLESS of the live rate -- the fix for the wrong-scale / mis-placed detections.
  real_time_downsample: true
  downsample_fft_size: 0            # 0 = auto-size from the live rate (keeps ~2-tile cost at any rate)
  # The X410 analog anti-alias filter rolls off toward the band edges; the fixed db_vmin/vmax clip
  # maps that tilt into the model's active range and it fires on the edges (activity where the raw
  # spectrogram shows none). Flattening the per-frequency floor removes it. (Off for the shipped
  # loopback config since that trained on unflattened captures; at the off-distribution live rate the
  # edge artifact dominates, so flatten on.)
  flatten_noise_floor: true

