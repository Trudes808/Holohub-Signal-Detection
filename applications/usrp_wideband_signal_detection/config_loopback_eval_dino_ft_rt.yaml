# VALIDATION-ONLY variant of config_loopback_v3_dino_ft.yaml for the offline-vs-loopback
# DINO-FT A/B (see notes/dino_ft_offline_vs_loopback_ab.md). Two deltas vs the shipped loopback
# DINO-FT config:
#   1. chdr_converter.channel_sample_rates_hz = 491.52e6 -- the loopback is pushed at the LIVE
#      radio rate so the detector sees the SAME wide-FFT/resize geometry it does live (the whole
#      point: reproduce the "atrocious" live behavior, not the 245.76 native-rate best case).
#      Launch with USRP_SAMPLE_RATE_HZ=491520000 too (run_loopback_v3_demo.sh RATE_HZ=491520000
#      PPS=480000); env supersedes config, and both are set to 491.52 here for self-consistency.
#   2. finetuned_dino_detector.debug_mask_dump_dir -- dump every emitted mask (.npy + manifest) on
#      a background thread so it can be diffed against run_cuda_dino_offline_file.py's masks. The
#      finetuned_dino_detector block is otherwise byte-identical to config_live_v3_dino_ft.yaml so
#      the ONLY difference between the two A/B legs is the ingest (file read vs DPDK/CHDR).
# NOT a demo config; keep out of the documented set. Runnable via
#   CONFIG_NAME=config_loopback_eval_dino_ft_rt.yaml (top-level so rebuild syncs it).
# SPDX-FileCopyrightText: 2026 National Instruments Corporation
# SPDX-License-Identifier: Apache-2.0
---
num_runs: -1

pipeline:
  enable_spectrogram: true
  enable_detector: true
  detector_type: "cuda_dino_finetuned"
  log_from_spectrogram: false
  # Cut detected signals out of the stream and write SigMF (requires enable_detector).
  enable_signal_snipper: true
  # Real-time IQ compression between snipper and sink (see snippet_compression: block).
  enable_snippet_compression: true

scheduler:
  worker_thread_number: 4
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 500

advanced_network:
  cfg:
    version: 1
    manager: "dpdk"
    master_core: 9
    debug: false
    log_level: "info"

    memory_regions:
      - name: "Headers_RX_CPU"
        kind: "huge"
        affinity: 0
        access:
          - local
        num_bufs: 262144   # headroom against rx_q_errors micro-drops at full rate (matches the perf configs)
        buf_size: 42
      - name: "CH1_CHDR_Headers_RX_CPU"
        kind: "huge"
        affinity: 0
        access:
          - local
        num_bufs: 262144   # headroom against rx_q_errors micro-drops at full rate (matches the perf configs)
        buf_size: 64
      - name: "CH1_Data_RX_GPU"
        kind: "huge"   # GB10 integrated GPU: NIC DMAs into host hugepages, GPU reads coherently (see notes/gb10_unified_memory_ingest.md)
        affinity: 0
        access:
          - local
        num_bufs: 262144   # headroom against rx_q_errors micro-drops at full rate (matches the perf configs)
        buf_size: 4096

    interfaces:
      - name: sdr_data
        address: 0000:01:00.0
        rx:
          flow_isolation: true
          queues:
            - name: "Channel 1 data"
              id: 0
              cpu_core: 10
              batch_size: 1024
              memory_regions:
                - "Headers_RX_CPU"
                - "CH1_CHDR_Headers_RX_CPU"
                - "CH1_Data_RX_GPU"

          flows:
            - name: "Channel 1 data packets"
              id: 0
              action:
                type: queue
                id: 0
              match:
                udp_src: 49153
                udp_dst: 1234

chdr_converter:
  interface_name: sdr_data
  num_complex_samples_per_packet: 1024
  num_packets_per_fft: 20
  num_ffts_per_batch: 512
  num_simul_batches: 4
  num_channels: 1
  # A/B: push the loopback at the LIVE radio rate so DINO-FT runs its live wide-FFT->resize geometry.
  channel_sample_rates_hz: "491.52e6"
  channel_center_frequencies_hz: "2400e6"
  log_packets: false
  log_data: false
  partial_batch_drop_timeout_ms: 250
  degraded_reset_on_rx_queue_warning: false
  degraded_shutdown_on_rx_queue_warning_threshold: 0   # 3 caused a full channel resync (data-flushing panic reset) on NIC micro-drop warnings — same fix as the perf configs (2026-08-15 smoke test: 24 panic resets/60s with 3, clean with 0)
  degraded_shutdown_force_exit_timeout_ms: 2000
  degraded_reset_partial_flush_threshold: 3
  degraded_reset_cooldown_ms: 1000

fft:
  burst_size: 20480
  num_bursts: 512
  num_channels: 1
  spectrum_type: 1
  averaging_type: 1
  window_time: 0
  window_type: 0
  reference_span_hz: 500000000
  reference_fft_size: 20480
  override_fft_bin_size: 0
  transform_points: 20480
  window_points: 20480
  resolution: 24414
  span: 500000000
  weighting_factor: 0
  f1_index: -10240
  f2_index: 10239
  window_time_delta: 0

logger:
  num_channels: 1
  log_interval: 5

visualization:
  detector_label: "Dinov3 FT (loopback EVAL 491.52)"
  enable: true   # viz on to reproduce the full live GPU load (and for the visual A/B screenshot)
  renderer:
    num_channels: 1
    history_frames: 1
    output_height: 720
    output_width: 1920
    display_time_rows: 2048
    display_freq_bins: 20480
    history_memory_budget_mb: 1024
    rows_per_frame: 8
    mask_frame_offset: 0
    allow_backpressure_valve: true
    render_every_n_frames: 1
    refresh_hz: 30
    timing_summary_enable: true
    timing_summary_every_n: 128
    decode_metrics_json: "/workspace/spectrograms/rt_metrics.json"   # LIVE DECODE sidebar panel (written by rt_decode_daemon.py --metrics-out)
    demo_control_json: "/workspace/spectrograms/demo_control.json"
    demo_controls_snr: false          # live radio: SNR pcap switching does not apply   # DEMO CONTROLS panel -> daemon gate + replay conductor
    channel_filter: 0
    tensor_name: "spectrogram"
    demo_title: "Enabling RF AI for Ultra Wideband Real Time Applications"
    demo_subtitle: "Holoscan enables GPU native real time signal processing and computer vision models to detect and extract regions of interest \n \t\t\t\t\t\t from a 500 MSps stream, reducing RF AI workloads to only the regions that matter."
    blue_limit: 0.15
    red_limit: 0.88
    overlay_alpha: 0.7
    center_frequency_hz: 2400000000.0
    fft_size: 20480
    dino_chunk_rows: 256
    dino_chunk_cols: 512
    db_floor: -20.0
    db_ceil: 15.0
    row_average_n: 1
  holoviz:
    width: 1920
    height: 720
    window_title: "USRP Wideband Spectrogram"
    fullscreen: false

spectrogram:
  num_channels: 1
  enable_save: false
  enable_tensor_save: false
  save_every_n_frames: 100
  max_images_per_channel: 0
  output_height: 256
  output_width: 512
  output_dir: "/workspace/spectrograms"

coherent_power_signal_detector:
  num_channels: 1
  input_height: 250
  input_width: 512
  fast_power_floor_db: 0.5
  fast_power_span_db: 3.0
  fast_score_threshold: 0.4
  fast_strong_rescue_enable: true
  fast_strong_rescue_excess_db: 8.0
  fast_strong_rescue_min_time_bins: 3
  per_freq_threshold_offset_db: 2.0
  per_freq_threshold_path: "/workspace/holohub/applications/usrp_wideband_signal_detection/calibration/coherent_power_per_freq_floor.npy"
  per_freq_threshold_mode: "dynamic"
  dynamic_floor_init_db: 40.0
  dynamic_floor_std_k: 2.0
  dynamic_floor_warmup_frames: 0
  dynamic_floor_window_slots: 8
  dynamic_floor_slot_frames: 16
  live_emit_mask_rows: 16
  live_emit_mask_cols: 512
  live_emit_freq_persistence_window: 45
  live_emit_freq_persistence_min_hits: 11
  emit_stride: 1
  log_detections: true
  save_performance_path_artifacts: false
  enable_mask_save: false
  save_every_n_frames: 100
  output_dir: "/workspace/coherent_power_masks"
  ignore_sideband_percent: 0.0
  ignore_sideband_hz: 7000000.0
  frontend_reference_q: 75.0
  frontend_smooth_sigma: 12.0
  frontend_max_boost_db: 0.0
  frontend_signal_cap_db: 0.0
  filter_detection_mask: true
  timing_summary_enable: true
  timing_summary_every_n: 512
  timing_summary_window: 512

snippet_compression:
  codec: "none"
  bfp_block: 64
  control_json_path: "/workspace/spectrograms/demo_control.json"

# --- Fine-tuned DINOv3 segmenter (M2_dr) -- BLOCK IDENTICAL TO config_live_v3_dino_ft.yaml -------
# EXCEPT the two debug_mask_dump_* keys below. This identity is the whole A/B: same detector, only
# the ingest differs between offline (file) and loopback (DPDK/CHDR).
finetuned_dino_detector:
  num_channels: 1
  tile_rows: 256
  nfft: 1024
  fft_window: "hann"
  db_vmin: -47.6526985168457
  db_vmax: 20.45633316040039
  threshold: 0.95
  model_script_path: "/workspace/holohub/dino_fine_tuning/weights/finetuned_dino_m2_dr_bf16.ts"
  torch_dtype: "fp32"               # vestigial: bf16 compute is baked into the traced .ts
  emit_stride: 4
  channel_filter: -1
  real_time_downsample: true
  downsample_fft_size: 0            # 0 = auto-size from the live rate (keeps ~2-tile cost at any rate)
  flatten_noise_floor: true
  # VALIDATION ONLY: dump every emitted mask (.npy uint8 + mask_dump_manifest.csv) on a background
  # thread. Host path: /tmp/usrp_spectrograms/loopback_eval/dino_ft_rt/mask_arrays/.
  debug_mask_dump_dir: "/workspace/spectrograms/loopback_eval/dino_ft_rt/mask_arrays"
  debug_mask_dump_max_frames: 250
  # invalid_frame_guard defaults ON (this is the guard-on A/B that matches results_guard/summary.json).
  # To regenerate the RT mask-on-spectrogram overlay panel (render_rt_overlays.py), flip these two and
  # set max_frames ~150:  debug_spectrogram_dump: true   +   invalid_frame_guard: false

# --- Signal snipper -----------------------------------------------------------------------------
signal_snipper:
  max_mask_occupancy: 0.90   # loopback: dense composites, block only near-full-band faults
  mode: "frequency"
  oversample_percent: 25.0
  enable_downsample: true
  bandwidth_margin_hz: 0.0
  min_box_pixels: 256
  merge_gap_rows: 16
  merge_gap_cols: 8
  fir_num_taps: 129
  ring_depth: 32
  center_frequency_hz: 0.0
  sample_rate_hz: 0.0

# --- SigMF file sink ----------------------------------------------------------------------------
sigmf_file_sink:
  write_budget_mb_s: 48.0
  stats_json: "/workspace/spectrograms/snip_stats.json"
  mode: "pack"
  pack_frames: 16
  output_dir: "/workspace/spectrograms/snippets"
  filename_prefix: "snip"
