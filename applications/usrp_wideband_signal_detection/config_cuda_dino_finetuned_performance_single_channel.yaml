#
# Plain live / offline-eval config for the fine-tuned DINOv3 segmenter detector
# (detector_type: cuda_dino_finetuned) with the deployed M5-S (ViT-S) export -- no snipper, no demo
# controls. The finetuned_dino_detector block is the same as the live demo's
# config_live_v3_dino_ft_m5s.yaml; keep them in sync when retuning.
#
# The detector taps RAW IQ (upstream of the wide analysis FFT) and runs its OWN nfft-point FFT to
# reproduce the model's trained per-pixel physics. tile_rows x nfft, db_vmin/db_vmax, fft_window and
# threshold MUST match the checkpoint's geometry contract (the *.meta.json written next to the .ts by
# export_dinov3_finetuned_torchscript.py). Bench: DGX Spark (NIC 0000:01:00.0, hugepage RX regions).
---
num_runs: -1

pipeline:
  enable_spectrogram: true          # still needed for the waterfall visualization
  enable_detector: true
  detector_type: "cuda_dino_finetuned"
  log_from_spectrogram: false

scheduler:
  worker_thread_number: 4
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 500

advanced_network:
  cfg:
    version: 1
    manager: "dpdk"
    master_core: 9
    debug: false
    log_level: "info"

    memory_regions:
      - name: "Headers_RX_CPU"
        kind: "huge"
        affinity: 0
        access:
          - local
        num_bufs: 131072
        buf_size: 42
      - name: "CH1_CHDR_Headers_RX_CPU"
        kind: "huge"
        affinity: 0
        access:
          - local
        num_bufs: 131072
        buf_size: 64
      - name: "CH1_Data_RX_GPU"
        kind: "huge"   # GB10 integrated GPU: NIC DMAs into host hugepages, GPU reads coherently (x86 GPUDirect bench: "device")
        affinity: 0
        access:
          - local
        num_bufs: 131072
        buf_size: 4096

    interfaces:
      - name: sdr_data
        address: 0000:01:00.0
        rx:
          flow_isolation: true
          queues:
            - name: "Channel 1 data"
              id: 0
              cpu_core: 10
              batch_size: 1024
              memory_regions:
                - "Headers_RX_CPU"
                - "CH1_CHDR_Headers_RX_CPU"
                - "CH1_Data_RX_GPU"

          flows:
            - name: "Channel 1 data packets"
              id: 0
              action:
                type: queue
                id: 0
              match:
                udp_src: 49153
                udp_dst: 1234

chdr_converter:
  interface_name: sdr_data
  channel_center_frequencies_hz: "2400e6"
  channel_sample_rates_hz: "500e6"
  num_complex_samples_per_packet: 1024
  num_packets_per_fft: 20
  num_ffts_per_batch: 512
  num_simul_batches: 4
  num_channels: 1
  log_packets: false
  log_data: false
  partial_batch_drop_timeout_ms: 250
  degraded_reset_on_rx_queue_warning: false
  degraded_shutdown_on_rx_queue_warning_threshold: 0
  degraded_shutdown_force_exit_timeout_ms: 2000
  degraded_reset_partial_flush_threshold: 0
  degraded_reset_cooldown_ms: 1000

fft:
  burst_size: 20480
  num_bursts: 512
  num_channels: 1
  spectrum_type: 1
  averaging_type: 1
  window_time: 0
  window_type: 0
  reference_span_hz: 500000000
  reference_fft_size: 20480
  override_fft_bin_size: 0
  transform_points: 20480
  window_points: 20480
  resolution: 24414
  span: 500000000
  weighting_factor: 0
  f1_index: -10240
  f2_index: 10239
  window_time_delta: 0

logger:
  num_channels: 1
  log_interval: 5

visualization:
  enable: true
  renderer:
    num_channels: 1
    history_frames: 1
    output_height: 720
    output_width: 1920
    display_time_rows: 2048
    display_freq_bins: 20480
    history_memory_budget_mb: 1024
    rows_per_frame: 2
    mask_frame_offset: 0
    allow_backpressure_valve: true
    refresh_hz: 60
    render_every_n_frames: 1
    timing_summary_enable: false
    timing_summary_every_n: 128
    channel_filter: 0
    tensor_name: "spectrogram"
    demo_title: "Enabling RF AI for Ultra Wideband Real Time Applications"
    demo_subtitle: "Holoscan enables GPU native real time signal processing and computer vision models to detect and extract regions of interest \n \t\t\t\t\t\t from a 500 MSps stream, reducing RF AI workloads to only the regions that matter."
    blue_limit: 0.15               # fallback during warmup / when dynamic_color_limits is false
    red_limit: 0.88
    # Auto-calibrate the spectrogram color range per run: accumulate a grayscale histogram over the
    # first N frames, then freeze blue=low-pct / red=high-pct for the run (recalibrates each launch).
    dynamic_color_limits: true
    dynamic_color_warmup_frames: 60
    dynamic_color_low_pct: 0.10    # noise floor -> blue
    # Span mode: red = blue + span, so anything just above the noise floor maps bright (faint signals
    # show; strong signals saturate). Smaller span = more sensitive; raise it if noise gets speckly.
    dynamic_color_span: 0.30
    dynamic_color_high_pct: 0.995  # only used if dynamic_color_span <= 0
    # Auto dB-floor: when dynamic_color_limits is true, db_floor auto-tracks the detected noise floor
    # over the warmup, freezing at (floor + offset). When false, the fixed db_floor below is used.
    # NOTE: offset is dB RELATIVE to the detected noise floor. It must be NEGATIVE so the display floor
    # sits BELOW the noise (headroom the dynamic-color stage needs to render noise-dim + signals-bright).
    # A positive/near-zero offset clips the noise to blue -> whole waterfall goes blue. ~-18 reproduces
    # the known-good static db_floor of -40 (noise ~-22 dB + (-18) = -40), now auto-tracked per band.
    dynamic_db_floor_offset_db: -18.0  # display floor = detected noise floor + this (negative = below noise)
    dynamic_db_floor_pct: 0.05         # noise floor = this percentile across per-column dB min-holds
    overlay_alpha: 0.7
    center_frequency_hz: 2400000000.0
    fft_size: 20480
    dino_chunk_rows: 256
    dino_chunk_cols: 512
    db_floor: -40.0
    db_ceil: 15.0
    row_average_n: 1
  holoviz:
    width: 1920
    height: 720
    window_title: "USRP Wideband Spectrogram"
    fullscreen: false

spectrogram:
  num_channels: 1
  enable_save: false
  enable_tensor_save: false
  save_every_n_frames: 100
  max_images_per_channel: 0
  output_height: 256
  output_width: 512
  output_dir: "/workspace/spectrograms"

finetuned_dino_detector:
  num_channels: 1
  tile_rows: 256
  nfft: 1024
  fft_window: "hann"
  db_vmin: -47.6526985168457
  db_vmax: 20.45633316040039
  threshold: 0.6
  model_script_path: "/workspace/holohub/dino_fine_tuning/weights/finetuned_dino_m5s_491_bf16.ts"
  torch_dtype: "fp32"               # vestigial: bf16 compute is baked into the traced .ts
  # LIVE @ 491.52 MSps: downsample mode makes each frame ~2 tiles, but the ~47 ms inference at
  # stride 4 (=11.7 Hz) plus the CHDR/FFT/viz GPU work intermittently oversubscribes the GB10 ->
  # 'Fell behind' RX-backlog events that assemble a recycled-mbuf garbage batch = the full-width
  # bright bar (root-caused 2026-09-20 OTA: single@4 -> 23 Fell-behind + 7 bars/120s; dual@16 -> 0).
  # 12 gives the inference comfortable headroom (kills the backlog garbage) while the viz mask-history
  # (holds the last mask up to 48 frames) keeps the ROI ribbon continuous. The broadband-suppress
  # guard in the viz still catches any residual bar. Native mode (below) is 20+ tiles/frame.
  emit_stride: 1
  channel_filter: -1
  # Native nfft-FFT at 491.52 MSps = 480 kHz/bin, DOUBLE M2_dr's trained 240 kHz/bin -> every
  # signal reads half-width at the wrong scale. Downsample mode FFTs wide (auto-sized to the actual
  # rate) then resizes the freq axis to nfft inside torch, so the model sees its trained per-pixel
  # geometry REGARDLESS of the live rate -- the fix for the wrong-scale / mis-placed detections.
  real_time_downsample: true
  circular_edge_inference: false   # M5-S single-pass (10.4ms) so emit_stride=1 fits the 21.3ms frame period
  downsample_fft_size: 0            # 0 = auto-size from the live rate (keeps ~2-tile cost at any rate)
  # The X410 analog anti-alias filter rolls off toward the band edges; the fixed db_vmin/vmax clip
  # maps that tilt into the model's active range and it fires on the edges (activity where the raw
  # spectrogram shows none). Flattening the per-frequency floor removes it. M3_491 is fine-tuned WITH
  # this flatten (dino_fine_tuning/src/frontend.py flatten=True), so keep it ON for BOTH live and
  # loopback to match the training front-end. (The older M2_dr model trained unflattened -- that is why
  # the operator DEFAULT is off; the stale "off for loopback" note referred to M2_dr.)
  flatten_noise_floor: true
  # Per-frame adaptive normalization: anchor [0,1] to the per-frame noise floor so a narrow live scene
  # fills the range like training and moderate signals are not compressed into noise (recovers them, cuts FP).
  adaptive_normalization: true
  adaptive_span_db: 34.0
  adaptive_floor_frac: 0.12
  # Robust floor ON: M3_491 is fine-tuned ON this exact robust normalization at the 491.52 deployment
  # geometry (dense+sparse, per-signal SNR). Offline validation (dino_ft_robust_norm/): held-out region
  # detection 83-100% across SNR; container A/B vs M2_dr on the sparse scene 43%->86%. Robust params
  # stay at operator defaults (low_pct 20, high_pct 95, min_range 8, floor_below_calib 25) = training.
  adaptive_robust_floor: true
  # Invalid-frame guard floor raised well above real busy-band activity. MEASURED 2026-09-20 (OTA @
  # 2.4 GHz, GAIN 15): legitimate frames run 4-15% mask occupancy, so the operator default 0.03
  # false-suppressed real dense frames AND deadlocked the cold-start baseline (it only updates on
  # accepted frames -> if every early frame exceeds the floor, it can never warm up). The bright-bar
  # root cause is fixed upstream (CHDR per-packet zero-fill, commit 14b7ae67), so this guard now only
  # needs to catch broadband (~100%) garbage. 0.40 >> real activity, << broadband corruption; k=2 keeps
  # k*baseline from inflating the threshold past the floor for realistic (<=~0.20) baselines.
  invalid_frame_min_occupancy: 0.40
  invalid_frame_occupancy_k: 2.0
